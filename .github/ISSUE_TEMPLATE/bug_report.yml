name: Bug report
description: Report reproducible behavior that is not working as expected.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Remove credentials, tokens, and private email content before submitting.
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Flutter client
        - Mail server
        - OAuth
        - IMAP / POP3 / SMTP
        - Push notifications
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Explain what happened and what you expected.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include OS, app version or commit, and mail provider.
    validations:
      required: true
